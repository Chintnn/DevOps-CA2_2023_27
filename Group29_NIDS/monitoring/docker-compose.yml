services:
  app:
    build: ..
    container_name: nids-api
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dash.yml
      - ./nids-dashboard.json:/var/lib/grafana/dashboards/nids-dashboard.json
    depends_on: [prometheus]